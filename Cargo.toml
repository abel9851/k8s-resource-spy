[package]
name = "k8s-resource-spy"
version = "0.2.0"  # Inference Proxy 기능 추가
edition = "2021"   # 2024는 없음, 2021이 stable

[dependencies]
# 비동기 런타임 - 동시에 여러 요청 처리
tokio = { version = "1.40", features = ["full"] }

# 웹 서버 프레임워크 - FastAPI의 Rust 버전
axum = "0.7"

# JSON 직렬화 - 구조체를 JSON으로 변환
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 로깅 - println! 대신 전문적인 로그
tracing = "0.1"
tracing-subscriber = "0.3"
